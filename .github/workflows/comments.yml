name: Check new comments

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may start it a few minutes late
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redeploy the site even without new comments"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update             # never runs at the same time as the full update
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check comments
        run: python3 fetch.py --comments
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        id: save
        run: |
          git config user.name "workshop-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if [ "${{ inputs.deploy }}" != "true" ] && git diff --cached --quiet docs/data; then echo "site=no" >> "$GITHUB_OUTPUT"; else echo "site=yes" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --quiet || git commit -q -m "New comments [skip ci]"
          git push -q || (git pull -q --rebase -X theirs && git push -q)

      # Redeploy the page only when a new comment came in.
      - if: steps.save.outputs.site == 'yes'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.site == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.save.outputs.site == 'yes'
        uses: actions/deploy-pages@v4
